name: Update the site

# One job keeps every sport up to date. Each sport has its own folder with its own code
# (volleyball/, hockey/, football/ which does college and the NFL, basketball/ which does college
# and the NBA, baseball/), its own folder of stored data on the `state` branch and its own folder
# of pages on the `gh-pages` branch. A sport that fails does not stop the others.

on:
  schedule:
    - cron: '47 10 * * *'   # every morning, about 5:47am Central: every sport, in full
    - cron: '47 16 * * *'   # every day about 11:47am Central: every sport again
    - cron: '47 22 * * *'   # every day about 5:47pm Central: every sport again, before the evening's games
    - cron: '47 4 * * *'    # every night about 11:47pm Central: every sport but hockey, so the night's results are in by morning
    - cron: '17 8 * * *'    # every night about 3:17am Central: every sport but volleyball, once the late games out west are over
    - cron: '13 21 * * 1'   # Monday about 4pm Central: volleyball and basketball, to look for the new AVCA and AP top 25
    - cron: '13 2 * * 2'    # Monday about 9pm Central: volleyball again, in case the poll came out late
    - cron: '23 19 * * 0'   # Sunday about 2:23pm Central: football, to look for the new AP top 25
    - cron: '23 23 * * 0'   # Sunday about 6:23pm Central: football again, in case the poll came out late
    # all day, every 5 minutes: live scores and box scores. Each sport looks whether one of its
    # games is on and stops within seconds when none is. (GitHub starts these less often than
    # asked, so a run that finds a game on keeps looking by itself: tools/follow.sh.)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['hockey/**', 'volleyball/**', 'football/**', 'basketball/**', 'baseball/**', 'home/**', 'tools/**', '.github/workflows/update.yml']

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  actions: write      # to keep the schedule switched on (last step)

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      # A run started by hand or by a code change checks the code first and looks for new polls straight away.
      BY_HAND: ${{ github.event_name != 'schedule' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5

      - name: Get what was stored last time
        id: state
        run: |
          set +e
          git ls-remote --exit-code --heads "$REPO_URL" state >/dev/null 2>&1
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then
            git clone --quiet --depth 1 --branch state "$REPO_URL" state
          elif [ "$found" -eq 2 ]; then          # the branch does not exist yet: the very first run
            mkdir state && git -C state init -q -b state
          else
            echo "The repository could not be reached, so nothing was updated."; exit 1
          fi

      # Which sports this run updates, and how: "full" (everything), "live" (only games under
      # way; the 5-minute runs) or "skip". state/last_full is when the last full update started.
      - name: Decide what to update
        id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          H=full; V=full; F=full; B=full; M=full; whole=1
          case "$SCHEDULE" in
            '*/5 '*) H=live; V=live; F=live; B=live; M=live; whole=0 ;;
            '47 4 * * *') H=skip ;;
            '17 8 * * *') V=skip ;;
            '13 21 * * 1') H=skip; F=skip; M=skip; whole=0 ;;
            '13 2 * * 2') H=skip; F=skip; B=skip; M=skip; whole=0 ;;
            '23 19 * * 0'|'23 23 * * 0') H=skip; V=skip; B=skip; M=skip; whole=0 ;;
          esac
          # GitHub now and then skips a scheduled run. The full runs are at most 6 hours apart, so
          # if none has happened for 7, this 5-minute run does the whole update in its place.
          now=$(date +%s)
          last=$(cat state/last_full 2>/dev/null || echo "$now")
          if [ "$whole" = 0 ] && [ "$H" = live ] && [ $(( now - last )) -gt 25200 ]; then
            echo "no full update for $(( (now - last) / 3600 )) hours, so this run does one"
            H=full; V=full; F=full; B=full; M=full; whole=1
          fi
          if [ "$whole" = 1 ] || [ ! -f state/last_full ]; then echo "$now" > state/last_full; fi
          echo "hockey=$H" >> "$GITHUB_OUTPUT"
          echo "volleyball=$V" >> "$GITHUB_OUTPUT"
          echo "football=$F" >> "$GITHUB_OUTPUT"
          echo "basketball=$B" >> "$GITHUB_OUTPUT"
          echo "baseball=$M" >> "$GITHUB_OUTPUT"
          echo "volleyball: $V, hockey: $H, football: $F, basketball: $B, baseball: $M"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Hockey
        id: hockey
        if: ${{ !cancelled() && steps.state.outcome == 'success' && steps.plan.outputs.hockey != 'skip' }}
        working-directory: hockey
        env:
          RUN_MODE: ${{ steps.plan.outputs.hockey }}
        run: ../tools/run_sport.sh hockey

      - name: Volleyball
        id: volleyball
        if: ${{ !cancelled() && steps.state.outcome == 'success' && steps.plan.outputs.volleyball != 'skip' }}
        working-directory: volleyball
        env:
          RUN_MODE: ${{ steps.plan.outputs.volleyball }}
          CHECK_POLL: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: ../tools/run_sport.sh volleyball

      - name: Football
        id: football
        if: ${{ !cancelled() && steps.state.outcome == 'success' && steps.plan.outputs.football != 'skip' }}
        working-directory: football
        env:
          RUN_MODE: ${{ steps.plan.outputs.football }}
          CHECK_POLL: ${{ github.event_name != 'schedule' && '1' || '0' }}
        run: ../tools/run_sport.sh football

      - name: Basketball
        id: basketball
        if: ${{ !cancelled() && steps.state.outcome == 'success' && steps.plan.outputs.basketball != 'skip' }}
        working-directory: basketball
        env:
          RUN_MODE: ${{ steps.plan.outputs.basketball }}
        run: ../tools/run_sport.sh basketball

      - name: Baseball
        id: baseball
        if: ${{ !cancelled() && steps.state.outcome == 'success' && steps.plan.outputs.baseball != 'skip' }}
        working-directory: baseball
        env:
          RUN_MODE: ${{ steps.plan.outputs.baseball }}
        run: ../tools/run_sport.sh baseball

      - name: Save what was stored
        if: ${{ always() && steps.state.outcome == 'success' }}
        run: tools/save_state.sh

      - name: Publish the site
        if: ${{ always() && steps.state.outcome == 'success' }}
        run: tools/publish.sh

      # GitHub starts the 5-minute runs about every 15 minutes in practice. So when a game is on,
      # this run keeps looking every 5 minutes itself until a newer run is waiting to take over.
      - name: Keep following the games that are on
        if: ${{ !cancelled() && steps.state.outcome == 'success' && startsWith(github.event.schedule, '*/5 ') && steps.plan.outputs.hockey == 'live' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/follow.sh

      # GitHub turns off scheduled jobs after 60 days without activity in the
      # repository (the off-season, say). Switching it on again each run resets that.
      - name: Keep the schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || echo "could not switch the schedule on; it may stop after 60 quiet days"
